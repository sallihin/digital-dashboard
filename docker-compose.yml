services:
  dashboard:
    # Built straight from GitHub so it works when only this file is deployed.
    build: https://github.com/sallihin/digital-dashboard.git#main
    image: digital-dashboard
    container_name: digital-dashboard
    restart: unless-stopped
    # Set these in your host's environment variables panel, or in a .env file
    # next to this file. See .env.example.
    environment:
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Fixed inside the container; change the published port with HOST_PORT.
      PORT: "3000"
      DATA_FILE: data/db.json
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - dashboard-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  dashboard-data:

services:
  dashboard:
    # Published by .github/workflows/docker-publish.yml on every push to main.
    image: ghcr.io/sallihin/digital-dashboard:latest
    pull_policy: always
    container_name: digital-dashboard
    restart: unless-stopped
    # Set these in your host's environment variables panel, or in a .env file
    # next to this file. See .env.example.
    environment:
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      # Served over HTTPS through Traefik.
      SECURE_COOKIE: ${SECURE_COOKIE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-true}
    # No published ports: Traefik (Hostinger's traefik-proxy network) routes
    # the domain to the container and handles HTTPS.
    networks:
      - traefik-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.digital-dashboard.rule=Host(`${DOMAIN:-dashboard.bearlabs.app}`)
      - traefik.http.routers.digital-dashboard.entrypoints=websecure
      - traefik.http.routers.digital-dashboard.tls.certresolver=letsencrypt
      - traefik.http.services.digital-dashboard.loadbalancer.server.port=3000
    volumes:
      - dashboard-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  traefik-proxy:
    external: true

volumes:
  dashboard-data:

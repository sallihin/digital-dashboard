<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Digital Dashboard</title>
<style>
:root{color-scheme:light;--bg:#EEEFF2;--card:#FFFFFF;--line:#DFE1E6;--ink:#1D1D1F;--muted:#6E6E76;--err:#D9257E;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","SF Pro",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111114;--card:#1C1C21;--line:#34343C;--ink:#F4F4F6;--muted:#A3A3AD;--err:#FF78C7}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;padding:24px}
form{width:min(380px,100%);background:var(--card);border-radius:20px;padding:36px 32px;display:flex;flex-direction:column;gap:18px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 30px rgba(0,0,0,.06)}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
p{margin:0;color:var(--muted);font-size:15px}
label{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
input{width:100%;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px}
input:focus-visible,button:focus-visible{outline:2px solid #FF4FA3;outline-offset:2px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 18px;background:var(--ink);color:var(--card);cursor:pointer}
.err{color:var(--err);font-size:14px}
small{color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Digital Dashboard</h1>
  <p>Enter the password to continue.</p>
  <!--ERROR-->
  <div><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus></div>
  <button type="submit">Sign in</button>
  <small>This dashboard is highly confidential. Do not share with anyone.</small>
</form>
</body>
</html>
